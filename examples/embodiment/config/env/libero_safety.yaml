env_type: libero_safety
task_suite_name: libero_safety

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 240
max_episode_steps: 240 # max episode steps for truncation

use_rel_reward: False
use_step_penalty: False
reward_coef: 1.0
safety_cost_coef: 1.0

# Evaluation-only counterfactual mode. Constrained obstacles remain visible,
# exert no contact forces, and are checked geometrically around each control step.
counterfactual_obstacle_eval: False
ghost_contact_margin: 0.0

# "native" preserves LIBERO-Safety data-collection dynamics. Use "standard"
# only when evaluating a standard-LIBERO policy in the Safety environment.
controller_profile: native

# Repository root. null resolves to ../LIBERO-Safety or LIBERO_SAFETY_REPO_PATH.
repo_path: null

# RLinf LiberoEnv specific settings
reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False

# Indicate the reset state id (related to the task_id and trial_id) want to be specified. (e.g.
# if set 0, the env always uses task 0 / trial 0 in the aggregated safety suite;
# if set null, initial states are sampled from the whole configured suite. )
specific_reset_id: null # can be a number or null.

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 256
  camera_widths: 256