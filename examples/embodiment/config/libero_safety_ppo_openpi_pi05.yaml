defaults:
  - env/libero_safety@env.train
  - env/libero_safety@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_safety_ppo_openpi_pi05"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_spatial
  train:
    # 64 envs x 2 epochs = 128 trajectories (6144 action chunks), which still
    # covers actor.global_batch_size=2048 without the original 8x rollout cost.
    rollout_epoch: 2
    total_num_envs: 64
    max_episode_steps: 240 # max episode steps for truncation
    max_steps_per_rollout_epoch: 240
    video_cfg:
      # Training video encoding blocks rollout while ffmpeg finalizes each MP4.
      save_video: False
  eval:
    rollout_epoch: 47
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_safety
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/public/tangwenhao/workspace/rlt/RLinf/logs/20260718-02:21:00-libero_safety_sft_openpi_pi05/libero_safety_sft_openpi_pi05/checkpoints/global_step_5000/actor"
    precision: ${actor.model.precision}
    openpi_data:
      repo_id: "LIBERO-Safety/libero_safety"
      norm_stats_path: "/mnt/public/tangwenhao/huggingface/lerobot/LIBERO-Safety/libero_safety/norm_stats.json"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0_5
  model:
    model_path: "/mnt/public/tangwenhao/workspace/rlt/RLinf/logs/20260718-02:21:00-libero_safety_sft_openpi_pi05/libero_safety_sft_openpi_pi05/checkpoints/global_step_5000/actor"
    model_type: "openpi"
    num_action_chunks: 5 # interface for the env
    num_steps: 3
    add_value_head: True
    openpi_data:
      repo_id: "LIBERO-Safety/libero_safety"
      norm_stats_path: "/mnt/public/tangwenhao/huggingface/lerobot/LIBERO-Safety/libero_safety/norm_stats.json"
    # openpi specific parameters
    openpi:
      config_name: "pi05_libero_safety"
      value_after_vlm: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
