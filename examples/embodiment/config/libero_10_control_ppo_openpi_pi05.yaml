# Initialize PPO from the matching standard-LIBERO control SFT checkpoint:
#   LIBERO_SFT_CHECKPOINT=/path/to/global_step_N \
#     bash examples/embodiment/run_embodiment.sh \
#     libero_10_control_ppo_openpi_pi05
#
# LIBERO_SFT_CHECKPOINT must point to global_step_N, not global_step_N/actor.

defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_control_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 2
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: false
  eval:
    # LIBERO-10 contains 10 tasks x 50 initial states. Eight rounds with 64
    # environments enumerate all 500 trials; exhausted slots are masked out.
    rollout_epoch: 8
    total_num_envs: 64
    auto_reset: true
    ignore_terminations: true
    use_ordered_reset_state_ids: true
    pad_eval_reset_state_ids: false
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: false
  unnorm_key: libero
  enable_offload: false
  pipeline_stage_num: 1
  model:
    # Point LIBERO_SFT_CHECKPOINT at the global_step_N produced by
    # libero_control_sft_openpi_pi05.
    model_path: ${oc.env:LIBERO_SFT_CHECKPOINT}
    precision: ${actor.model.precision}
    openpi_data:
      repo_id: "physical-intelligence/libero"
      norm_stats_path: "/mnt/public/tangwenhao/huggingface/lerobot/physical-intelligence/libero/norm_stats.json"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  model:
    model_path: ${oc.env:LIBERO_SFT_CHECKPOINT}/actor
    model_type: "openpi"
    num_action_chunks: 5
    action_dim: 7
    num_steps: 3
    add_value_head: true
    openpi_data:
      repo_id: "physical-intelligence/libero"
      norm_stats_path: "/mnt/public/tangwenhao/huggingface/lerobot/physical-intelligence/libero/norm_stats.json"
    openpi:
      config_name: "pi05_libero"
      num_images_in_input: 2
      train_expert_only: false
      detach_critic_input: true
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      use_rlt: false
      value_after_vlm: true
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
